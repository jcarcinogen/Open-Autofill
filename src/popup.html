<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="app-heading">
        <img src="../icons/icon32.png" width="32" height="32" alt="" />
        <div>
          <div class="title-row">
            <h1>Open Autofill</h1>
            <span id="version" class="version"></span>
          </div>
        <p id="host" class="muted">—</p>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoFill" />
        <span>Auto-fill</span>
      </label>
    </header>

    <section class="actions">
      <button id="fill" class="primary">Fill this page</button>
      <button id="remember">Remember this page</button>
    </section>
    <p id="status" class="status" role="status" aria-live="polite" hidden></p>

    <section>
      <h2>Your usual answers</h2>
      <p class="muted small">
        These travel across sites. Type a different email or phone on one site and it stays specific to that site.
      </p>
      <div id="identity" class="grid"></div>
    </section>

    <footer>
      <button id="exclude" class="ghost">Ignore this site</button>
      <button id="options" class="ghost">All settings</button>
    </footer>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
