<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- Store artwork: exact 96 x 96 footprint, centered in transparent 128 x 128. -->
  <rect x="16" y="16" width="96" height="96" rx="23" fill="#215a25"/>
  <!-- Open form: optically balanced, deliberately no tiny internal lines. -->
  <path d="M65 40H42V86H70" stroke="#f3ece3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- One solid pencil silhouette; no cap seam or pencil facets. -->
  <path d="M57 76L62 62L80 44Q83 41 86 44L91 49Q94 52 91 55L73 73Z" fill="#f3ece3"/>
  <!-- One large sparkle, separated from the pencil. -->
  <path d="M88 73L91 81L99 84L91 87L88 95L85 87L77 84L85 81Z" fill="#f3ece3"/>
</svg>
