<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Open Autofill practice form</title>
    <style>
      :root { font-family: system-ui, sans-serif; background: #161513; color: #f3ece3; }
      body { max-width: 560px; margin: 40px auto; }
      label { display: block; margin: 12px 0 4px; color: #b4a99b; }
      input, select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #3a342c; background: #201e1b; color: inherit; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      button { margin-top: 18px; padding: 10px 14px; border: 0; border-radius: 8px; background: #e0a14a; color: #1b140c; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Practice form</h1>
    <p>Load Open Autofill, fill this once, reload, and it should come back.</p>
    <form>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" />

      <div class="row">
        <div>
          <label for="first_name">First name</label>
          <input id="first_name" name="first_name" autocomplete="given-name" />
        </div>
        <div>
          <label for="last_name">Last name</label>
          <input id="last_name" name="last_name" autocomplete="family-name" />
        </div>
      </div>

      <label for="street">Street address</label>
      <input id="street" name="street_address" autocomplete="address-line1" />

      <div class="row">
        <div>
          <label for="city">City</label>
          <input id="city" name="city" autocomplete="address-level2" />
        </div>
        <div>
          <label for="state">State</label>
          <input id="state" name="state" autocomplete="address-level1" />
        </div>
      </div>

      <label for="zip">ZIP</label>
      <input id="zip" name="zip" autocomplete="postal-code" />

      <label for="ig">Instagram handle</label>
      <input id="ig" name="instagram_handle" placeholder="@yourhandle" />

      <label for="favorite">Favorite flavor (site-specific)</label>
      <input id="favorite" name="favorite_flavor" />

      <label><input type="checkbox" name="rules" /> I agree to the official rules</label>
      <button type="submit">Submit</button>
    </form>
    <script>
      document.querySelector("form").addEventListener("submit", (e) => {
        e.preventDefault();
        alert("Pretend submit — Open Autofill should have saved the fields.");
      });
    </script>
  </body>
</html>
