<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>Open Autofill</h1>
        <p id="host" class="muted">—</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoFill" />
        <span>Auto-fill</span>
      </label>
    </header>

    <section class="actions">
      <button id="fill" class="primary">Fill this page</button>
      <button id="remember">Remember this page</button>
    </section>
    <p id="status" class="status" hidden></p>

    <section>
      <h2>Your usual answers</h2>
      <p class="muted small">
        These travel across sites. Extra one-off fields are remembered per website.
      </p>
      <div id="identity" class="grid"></div>
    </section>

    <footer>
      <button id="exclude" class="ghost">Ignore this site</button>
      <button id="options" class="ghost">All settings</button>
    </footer>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
